# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = %(here)s/migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Sys.path prepend - adds backend directory to python path
prepend_sys_path = %(here)s
path_separator = os

# Version path separator
version_path_separator = os

# Default sqlalchemy url (can be overridden by DATABASE_URL env var in env.py)
sqlalchemy.url = sqlite:///app.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
