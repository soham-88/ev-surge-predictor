version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ev-surge-backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173
      - DATABASE_URL=sqlite:////app/data/app.db
      - JWT_SECRET=${JWT_SECRET:-ev_surge_production_jwt_secret_grid_pulse_2026}
      - DEMO_OPERATOR_PASSWORD=${DEMO_OPERATOR_PASSWORD:-operatorpassword123}
      - DEMO_VIEWER_PASSWORD=${DEMO_VIEWER_PASSWORD:-viewerpassword123}
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - grid-pulse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ev-surge-frontend
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - grid-pulse-net

volumes:
  backend_data:

networks:
  grid-pulse-net:
    driver: bridge
