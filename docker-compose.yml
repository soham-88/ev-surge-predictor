# NOTE: The default PostgreSQL credentials below are development-only defaults for local Docker evaluation.
# In staging or production environments, set unique values via POSTGRES_USER, POSTGRES_PASSWORD,
# POSTGRES_DB, and JWT_SECRET environment variables.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ev-surge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grid_pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grid_pulse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ev_surge_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-grid_pulse} -d $${POSTGRES_DB:-ev_surge_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - grid-pulse-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ev-surge-backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-grid_pulse}:${POSTGRES_PASSWORD:-grid_pulse_dev_password}@postgres:5432/${POSTGRES_DB:-ev_surge_db}
      - JWT_SECRET=${JWT_SECRET:-dev-only-insecure-change-me}
      - DEMO_OPERATOR_PASSWORD=${DEMO_OPERATOR_PASSWORD:-operatorpassword123}
      - DEMO_VIEWER_PASSWORD=${DEMO_VIEWER_PASSWORD:-viewerpassword123}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - grid-pulse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ev-surge-frontend
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - grid-pulse-net

volumes:
  postgres_data:

networks:
  grid-pulse-net:
    driver: bridge
